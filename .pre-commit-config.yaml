# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # Catches a committed tfstate or tfvars before it reaches the remote.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          # The root module has a remote backend; validate it without contacting
          # Azure.
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/terraform/.tflint.hcl

  - repo: local
    hooks:
      - id: bicep-build
        name: bicep build
        language: system
        files: '^bicep/.*\.(bicep|bicepparam)$'
        pass_filenames: false
        entry: >
          bash -c 'az bicep build --file bicep/main.bicep --stdout > /dev/null
          && az bicep build --file bicep/managementGroups.bicep --stdout > /dev/null
          && az bicep build-params --file bicep/main.bicepparam --stdout > /dev/null'
