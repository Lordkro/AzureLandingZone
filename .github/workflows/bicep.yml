name: Bicep

on:
  pull_request:
    branches: [main]
    paths:
      - "bicep/**"
      - ".github/workflows/bicep.yml"
  push:
    branches: [main]
    paths:
      - "bicep/**"
      - ".github/workflows/bicep.yml"

permissions:
  id-token: write # OIDC federated login to Azure
  contents: read
  pull-requests: write

env:
  LOCATION: westeurope
  DEPLOYMENT_NAME: alz-${{ github.run_number }}

jobs:
  validate:
    name: Lint, Validate & What-If
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep lint
        run: az bicep build --file bicep/main.bicep --stdout > /dev/null

      - name: Validate deployment
        run: |
          az deployment sub validate \
            --name "${DEPLOYMENT_NAME}-validate" \
            --location "$LOCATION" \
            --template-file bicep/main.bicep \
            --parameters bicep/main.bicepparam

      - name: What-if
        id: whatif
        run: |
          az deployment sub what-if \
            --name "${DEPLOYMENT_NAME}-whatif" \
            --location "$LOCATION" \
            --template-file bicep/main.bicep \
            --parameters bicep/main.bicepparam \
            --result-format FullResourcePayloads > whatif.txt
          cat whatif.txt

      - name: Comment what-if on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const whatif = fs.readFileSync('whatif.txt', 'utf8');
            const body = `#### Bicep What-If
            <details><summary>Show changes</summary>

            \`\`\`
            ${whatif}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.substring(0, 65000)
            });

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production # requires manual approval when configured
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy landing zone
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location "$LOCATION" \
            --template-file bicep/main.bicep \
            --parameters bicep/main.bicepparam
