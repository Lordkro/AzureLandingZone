version: 2
updates:
  # Pinned action versions go stale silently; this is the only thing in the repo
  # that fetches third-party code at run time.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci

  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - terraform
    # Provider majors change resource schemas; review those by hand.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
